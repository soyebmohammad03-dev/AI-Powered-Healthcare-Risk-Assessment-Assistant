name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Apple Silicon: the platform the setup and the pinned model files are verified on.
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install OpenMP for XGBoost
        run: brew install libomp

      # The dataset and the trained models are not committed. Reuse them while the code and pins are
      # unchanged; otherwise setup.sh downloads the pinned dataset and retrains (about 10 minutes).
      - name: Restore dataset and models
        uses: actions/cache@v4
        with:
          path: |
            data/cardio_train.csv
            models/*.joblib
            artifacts/oof_predictions.npz
          key: models-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('requirements.txt', 'src/**/*.py') }}

      - name: Set up (venv, dependencies, dataset, missing models)
        run: PYTHON=python ./scripts/setup.sh

      - name: Run the test suite
        run: .venv/bin/python -m pytest -q
