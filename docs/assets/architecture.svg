<text x="640" y="712" font-size="11.5" fill="#5B6472">Dashed arrows: what the app loads. The final model; the candidate models and novelty</text>
<text x="640" y="728" font-size="11.5" fill="#5B6472">detector for the reliability signals; the committed artifacts for the Model and Methodology</text>
<text x="640" y="744" font-size="11.5" fill="#5B6472">pages. The app never retrains: ./scripts/setup.sh rebuilds every output from the pinned dataset.</text>
