<text x="640" y="44" font-size="12" font-weight="700" letter-spacing="1.6" fill="#0F6E6E">RESEARCH PIPELINE (OFFLINE)</text>
<text x="640" y="62" font-size="12" fill="#5B6472">python -m src.train_models → src.analysis → src.reliability → src.shift_analysis</text>
<rect x="640" y="80" width="520" height="56" rx="9" fill="#F5F5FE" stroke="#D5DBE3"/>
<rect x="640" y="80" width="5" height="56" rx="2.5" fill="#6366F1"/>
<text x="660" y="102" font-size="14.5" font-weight="650" fill="#111827">Dataset</text>
<text x="1146" y="102" font-size="11" text-anchor="end" fill="#6366F1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">src/data_loader.py</text>
<text x="660" y="121" font-size="12" fill="#5B6472">Kaggle cardiovascular dataset, 70,000 rows, SHA-256 pinned</text>
<rect x="640" y="152" width="520" height="56" rx="9" fill="#F5F5FE" stroke="#D5DBE3"/>
<rect x="640" y="152" width="5" height="56" rx="2.5" fill="#6366F1"/>
<text x="660" y="174" font-size="14.5" font-weight="650" fill="#111827">Cleaning</text>
<text x="1146" y="174" font-size="11" text-anchor="end" fill="#6366F1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">src/data_loader.py</text>
<text x="660" y="193" font-size="12" fill="#5B6472">documented exclusion rules → 68,573 rows</text>
<rect x="640" y="224" width="520" height="56" rx="9" fill="#F5F5FE" stroke="#D5DBE3"/>
<rect x="640" y="224" width="5" height="56" rx="2.5" fill="#6366F1"/>
<text x="660" y="246" font-size="14.5" font-weight="650" fill="#111827">Split</text>
<text x="1146" y="246" font-size="11" text-anchor="end" fill="#6366F1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">src/data_loader.py</text>
<text x="660" y="265" font-size="12" fill="#5B6472">stratified 80/20, seed 42 · test set held out until after selection</text>
<rect x="640" y="296" width="520" height="56" rx="9" fill="#F5F5FE" stroke="#D5DBE3"/>
<rect x="640" y="296" width="5" height="56" rx="2.5" fill="#6366F1"/>
<text x="660" y="318" font-size="14.5" font-weight="650" fill="#111827">Model comparison</text>
<text x="1146" y="318" font-size="11" text-anchor="end" fill="#6366F1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">src/train_models.py</text>
<text x="660" y="337" font-size="12" fill="#5B6472">LR, RF, XGBoost × raw / sigmoid / isotonic · 5×5 repeated CV</text>
<rect x="640" y="368" width="520" height="56" rx="9" fill="#F5F5FE" stroke="#D5DBE3"/>
<rect x="640" y="368" width="5" height="56" rx="2.5" fill="#6366F1"/>
<text x="660" y="390" font-size="14.5" font-weight="650" fill="#111827">Selection</text>
<text x="1146" y="390" font-size="11" text-anchor="end" fill="#6366F1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">src/train_models.py</text>
<text x="660" y="409" font-size="12" fill="#5B6472">corrected resampled t-tests, α = 0.05 · exact-SHAP eligibility</text>
<rect x="640" y="440" width="520" height="72" rx="9" fill="#F5F5FE" stroke="#D5DBE3"/>
<rect x="640" y="440" width="5" height="72" rx="2.5" fill="#6366F1"/>
<text x="660" y="462" font-size="14.5" font-weight="650" fill="#111827">Evaluation and explainability</text>
<text x="1146" y="462" font-size="11" text-anchor="end" fill="#6366F1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">src/analysis.py</text>
<text x="660" y="481" font-size="12" fill="#5B6472">held-out test once · bootstrap CIs, calibration, thresholds,</text>
<text x="660" y="497" font-size="12" fill="#5B6472">subgroups · global SHAP, permutation importance, PDP/ICE</text>
<rect x="640" y="528" width="520" height="72" rx="9" fill="#F5F5FE" stroke="#D5DBE3"/>
<rect x="640" y="528" width="5" height="72" rx="2.5" fill="#6366F1"/>
<text x="660" y="550" font-size="14.5" font-weight="650" fill="#111827">Reliability</text>
<text x="1146" y="550" font-size="11" text-anchor="end" fill="#6366F1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">src/reliability.py · src/shift_analysis.py</text>
<text x="660" y="569" font-size="12" fill="#5B6472">novelty detector, perturbation and explanation stability,</text>
<text x="660" y="585" font-size="12" fill="#5B6472">monotonicity, disagreement · synthetic shift experiment</text>
<rect x="640" y="616" width="520" height="72" rx="9" fill="#ECECFD" stroke="#D5DBE3"/>
<rect x="640" y="616" width="5" height="72" rx="2.5" fill="#6366F1"/>
<text x="660" y="638" font-size="14.5" font-weight="650" fill="#111827">Saved outputs</text>
<text x="660" y="657" font-size="12" fill="#5B6472">models/*.joblib: final model, candidates, novelty detector (rebuilt)</text>
<text x="660" y="673" font-size="12" fill="#5B6472">artifacts/*.json: metrics and analyses with provenance (committed)</text>
